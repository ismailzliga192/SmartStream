<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./css/output.css" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <main class="flex flex-row w-full h-screen static">
    <section class="flex flex-col bg-gray-800 w-[50%] h-screen">
        
        <div class="flex flex-row">
            <button class="w-[10%] h-[55%]" id="open-popout"><img src="imgs/triangle_droite_bleu_fonce.png" alt="button" class="w-full h-full"></button>
            
            <img src="imgs/SMART STREAM@2x.png" alt="logo" class="w-1/2 h-[50%] m-2">
            
            <input type="search" class="w-[95%] text-white border border-white rounded bg-gray-950 mt-9 mr-3 p-2 h-[15%]">

        </div>
       
        <ul class="flex flex-col bg-gray-950 mt-9 w-full border border-blue-800 h-[76%] overflow-y-auto" id="channel">
                
        </ul>
            

       

    </section>
    <section class=" bg-gray-900 w-[30%] h-screen absolute left-0 top-0 hidden" id="popout-page">
        <button type="button" id="close-popout" class="w-12 h-12 rounded-full bg-amber-500 text-white text-2xl">X</button>

    </section>
    <section class="w-screen">
    <div class="flex flex-row bg-blue-700 h-1/2 w-full">
    

    </div>
    <div class="flex flex-col bg-gray-950 w-full h-1/2">
      <h1 class=""></h1>
    </div>

    </section>
    
   
    </main>
    
    <script type="module" src="./js/main.js"></script>
</body>
</html>
